<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid Marleen">
<meta name="theme-color" content="#111214">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">

<title>Hybrid · Marleen</title>
<style>
:root{--bg:#111214;--c1:#1B1D1F;--c2:#24272A;--line:rgba(255,255,255,.07);--tx:#F2F3F0;--mu:#7E847A;--mu2:#A3A99F;--lime:#C6F432;--limeInk:#1B2404;--ok:#5FD08A;--warn:#F2B94B;--red:#FF6B5E;--strava:#FC4C02;--or:#FF8A1F;--nav:62px;--hdr:56px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:400 14px/1.5 Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
a{color:var(--lime)}
.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.3px;text-transform:uppercase}
.hdr{position:fixed;top:0;left:0;right:0;height:calc(var(--hdr) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;z-index:50;border-bottom:1px solid var(--line)}
.logo{font-family:"Barlow Condensed";font-weight:700;font-size:24px;letter-spacing:1px}
.logo i{color:var(--lime);font-style:normal}
.logo{display:flex;align-items:center;gap:9px}
.logo img{width:30px;height:30px;border-radius:8px}
.hero{position:relative}
.hero .sky{display:block;width:100%;height:auto;margin-top:12px;opacity:.28;pointer-events:none}
.phase svg{width:40px;height:26px;flex-shrink:0;align-self:center}
.phase .pt{display:flex;flex-direction:column}
.phase .pm{font-family:Inter;font-size:12px;color:var(--mu);font-weight:500;text-transform:none;margin-top:2px}
.bean{width:18px;height:23px;display:block;margin:0 auto 2px}
.seal{display:block;margin:18px auto 4px;width:190px;height:190px}
#splash{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
#splash .seal{width:210px;height:210px;margin:0}
#splash p{font-size:11px;letter-spacing:2px;color:var(--mu);margin-top:14px;text-transform:uppercase}
.hr{text-align:right;font-size:11px;color:var(--mu);line-height:1.3}
.hr b{display:block;color:var(--lime);font-family:"Barlow Condensed";font-size:15px;letter-spacing:.6px;font-weight:600}
main{position:fixed;top:calc(var(--hdr) + env(safe-area-inset-top));bottom:calc(var(--nav) + env(safe-area-inset-bottom));left:0;right:0}
.panel{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 34px}
.panel.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#0C0D0E;border-top:1px solid var(--line);display:flex;z-index:50}
nav button{flex:1;background:none;border:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--lime)}
.card{background:var(--c1);border-radius:16px;padding:15px;margin-bottom:12px}
.sec{font-family:"Barlow Condensed";font-weight:600;font-size:14px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mu);margin:20px 2px 9px;display:flex;justify-content:space-between;align-items:center}
.sec:first-child{margin-top:2px}
.mu{color:var(--mu)}.mu2{color:var(--mu2)}.sm{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--c2);color:var(--mu2)}
.pill.l{background:rgba(198,244,50,.12);color:var(--lime)}
.pill.w{background:rgba(242,185,75,.12);color:var(--warn)}
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.datebar button{width:42px;height:42px;border-radius:14px;border:none;background:var(--c1);font-size:20px}
.datebar .d{text-align:center;font-weight:600}
.datebar .d small{display:block;color:var(--mu);font-weight:500;font-size:11px;letter-spacing:.5px}
.hero{padding:4px 2px 6px}
.hero h1{font-family:"Barlow Condensed";font-weight:700;font-size:38px;line-height:.98;letter-spacing:.2px;text-transform:uppercase;margin:8px 0 6px}
.hero p{color:var(--mu2);font-size:13px}
.ex{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--c1);border-radius:14px;padding:13px 14px;margin-bottom:7px;cursor:pointer}
.ex .n{font-weight:600;font-size:14px}
.ex .s{font-size:12px;color:var(--mu)}
.ex .k{text-align:right;flex-shrink:0}
.ex .k b{display:block;color:var(--lime);font-family:"Barlow Condensed";font-size:20px;font-weight:600;line-height:1}
.ex .k small{font-size:11px;color:var(--mu)}
.wod{background:var(--lime);color:var(--limeInk);border-radius:18px;padding:16px;margin:4px 0 12px}
.wod .t{font-family:"Barlow Condensed";font-weight:700;font-size:26px;line-height:1;text-transform:uppercase}
.wod .f{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;opacity:.75;margin-bottom:6px}
.wod ul{list-style:none;margin-top:10px}
.wod li{padding:6px 0;border-top:1px solid rgba(27,36,4,.15);font-weight:500;font-size:14px}
.wod .note{font-size:12px;margin-top:10px;opacity:.8}
.wod .chips{margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:none;background:var(--c2);border-radius:20px;padding:7px 12px;font-size:12px;font-weight:600}
.wod .chip{background:rgba(27,36,4,.12);color:var(--limeInk)}
.list{background:var(--c1);border-radius:14px;padding:4px 14px;margin-bottom:12px}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.li:last-child{border:none}
.li b{font-weight:500;color:var(--mu2);white-space:nowrap}
details.list summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;font-weight:600}
details.list summary::-webkit-details-marker{display:none}
details.list summary span{color:var(--mu);font-weight:500;font-size:12px}
details.list[open] summary{border-bottom:1px solid var(--line)}
.strava{display:flex;align-items:center;gap:12px;background:rgba(95,208,138,.1);border:1px solid rgba(95,208,138,.28);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.strava .ic{width:34px;height:34px;border-radius:10px;background:#D10027;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex-shrink:0}
.strava b{color:var(--ok)}
.macros{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;margin-top:10px}
.mac{background:var(--c2);border-radius:12px;padding:10px 6px;text-align:center}
.mac b{display:block;font-family:"Barlow Condensed";font-size:24px;font-weight:600;line-height:1}
.mac small{font-size:10px;color:var(--mu);letter-spacing:.6px;text-transform:uppercase}
.mac.k b{color:var(--lime)}
.study{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{border:1px solid var(--line);background:var(--c2);border-radius:14px;padding:12px 8px;text-align:center}
.st .i{font-size:20px}
.st b{display:block;font-size:13px;margin-top:4px}
.st small{display:block;font-size:11px;color:var(--mu)}
.st.ok{background:var(--lime);color:var(--limeInk);border-color:var(--lime)}
.st.ok small{color:var(--limeInk);opacity:.7}
.btn{width:100%;padding:14px;border:none;border-radius:14px;background:var(--lime);color:var(--limeInk);font-weight:700;font-size:14px;letter-spacing:.3px}
.btn2{padding:11px 14px;border:none;border-radius:12px;background:var(--c2);font-size:13px;font-weight:600}
.btn2.s{background:rgba(252,76,2,.15);color:var(--strava)}
.btn2.r{color:var(--red)}
.inp{width:100%;background:var(--c2);border:1px solid transparent;border-radius:12px;color:var(--tx);padding:11px 12px;font-size:15px;outline:none;-webkit-appearance:none;font-family:inherit}
.inp:focus{border-color:rgba(198,244,50,.5)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.fld{margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wk{background:var(--c1);border-radius:16px;padding:13px;margin-bottom:10px;border:1px solid transparent}
.wk.cur{border-color:rgba(198,244,50,.5)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.day{border:none;background:var(--c2);border-radius:10px;padding:7px 0 6px;text-align:center;font-size:10px;font-weight:700;position:relative;color:var(--tx)}
.day small{display:block;font-size:9px;color:var(--mu);font-weight:600;margin-top:1px}
.day.rest{opacity:.4}
.day.today{outline:1.5px solid var(--lime)}
.day.ok{background:rgba(95,208,138,.16)}
.day.ok::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.phase{font-family:"Barlow Condensed";font-size:20px;font-weight:700;text-transform:uppercase;margin:22px 2px 8px;display:flex;align-items:baseline;gap:8px}
.phase small{font-family:Inter;font-size:12px;color:var(--mu);font-weight:500;text-transform:none}
.count{display:flex;gap:10px;margin-bottom:12px}
.count .c{flex:1;background:var(--c1);border-radius:16px;padding:13px}
.count b{display:block;font-family:"Barlow Condensed";font-size:34px;font-weight:700;line-height:1}
.count .c.l b{color:var(--lime)}
.tq{background:var(--c1);border-radius:14px;padding:12px 14px;margin-bottom:7px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;display:none}.mbg.on{display:block}
.modal{position:fixed;left:0;right:0;bottom:0;max-height:86vh;background:var(--c1);border-radius:22px 22px 0 0;z-index:91;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.modal.on{display:flex}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px}
.mh b{font-family:"Barlow Condensed";font-size:24px;font-weight:700;text-transform:uppercase;line-height:1}
.mh button{width:32px;height:32px;border-radius:50%;border:none;background:var(--c2);color:var(--mu2);font-size:15px}
.mb{padding:4px 18px 22px;overflow-y:auto}
.mb ol,.mb ul{padding-left:18px}.mb li{margin:7px 0;color:var(--mu2)}
.knee{background:rgba(242,185,75,.1);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2B2F33;color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.pill.o{background:rgba(255,138,31,.14);color:var(--or)}
.fence{display:flex;align-items:center;gap:12px;background:rgba(255,138,31,.09);border:1px solid rgba(255,138,31,.28);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.fence .ic{width:34px;height:34px;border-radius:10px;background:var(--or);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fence .ic svg{width:22px;height:22px}
.fence b{color:var(--or)}
.btn.busy{animation:syncp 1.1s ease-in-out infinite}
@keyframes syncp{0%,100%{opacity:.5}50%{opacity:1}}
</style>
</head>
<body>
<div id="splash"></div>
<header class="hdr"><div class="logo"><img src="icon-192.png?v=1" alt=""><span>HYBRID<i>.</i></span></div><div class="hr" id="hr"></div></header>
<main>
  <section id="p-hoy" class="panel on"></section>
  <section id="p-plan" class="panel"></section>
  <section id="p-prog" class="panel"></section>
  <section id="p-tec" class="panel"></section>
  <section id="p-aj" class="panel"></section>
</main>
<nav>
  <button id="n-hoy" class="on" onclick="show('hoy')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button id="n-plan" onclick="show('plan')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button id="n-prog" onclick="show('prog')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
  <button id="n-tec" onclick="show('tec')"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Technique</button>
  <button id="n-aj" onclick="show('aj')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div class="mbg" id="mbg" onclick="closeModal()"></div>
<div class="modal" id="modal"><div class="mh"><b id="mt"></b><button onclick="closeModal()">✕</button></div><div class="mb" id="mbody"></div></div>
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
//  HYBRID · Marleen Buitenhuis
//  Professional sabre fencer · season Oct 2026 → Jul 2027
//  Trains at the gym with Felipe + her fencing schedule. Goal: 55 → 60 kg, faster and more explosive.
//  The app guides; Marleen taps a session as done and, if she wants, logs the kg.
// ═══════════════════════════════════════════
const OWNER = "MARLEEN";
const START = "2026-10-12";      // Monday, week 1
const END = "2027-07-25";        // end of season
const WEEKS = 41;
const PRE = { "2026-10-12": "TU" };   // upper test done with Felipe on Monday 12 Oct
const LS = "hybrid_marleen_v1";
const SELF = "https://felipehernandezlopez.github.io/hybrid-marleen/";
// Polar only accepts Felipe's app as return address: it relays the code to Marleen's sheet and sends her back here
const POLAR_ID = "8034e007-b5e5-463d-bb19-13dcebc363d8";
const POLAR_RETURN = "https://felipehernandezlopez.github.io/hybrid-tracker/";
const DN = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DF = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const MN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const PHASE = ["", "Base", "Power", "Competition"];
const PHASE_SUB = ["", "Strength and muscle: the engine for 60 kg", "Turn strength into speed: jumps, starts, single-leg power", "Stay strong, be fast, arrive fresh"];
const PHASE_MEAN = ["", "The tulip · grow from the bulb", "The windmill · turn force into power", "The sabre · sharp and ready"];
const PHASE_ART = ["", "tulip", "mill", "sabre"];

// Weekly schedule (confirmed by Marleen 13 Oct). Fencing is counted from Polar; the gym sessions fit around it.
const FENCE = { 0: "afternoon", 2: "afternoon", 3: "morning + afternoon", 4: "afternoon" };
const REST_DOW = 1;                 // Tuesday: always rest
const GYM_DAYS = [0, 2, 4, 5];      // Mon, Wed, Fri mornings + Saturday
const BACKUP_DOW = 6;               // Sunday: rest, or catch-up if a session is still missing
const NO_LEGS = [2, 3, 4];          // no heavy legs Wed–Fri: Thursday is a double fencing day
const PREF = { 0: ["P", "L", "TL", "U", "TU", "F"], 2: ["U", "TU", "P", "F"], 4: ["F", "U", "TU", "P"], 5: ["L", "TL", "P", "U", "TU", "F"], 6: ["L", "TL", "U", "TU", "P", "F"] };
const LEGS = { L: 1, TL: 1 };

// 25 y · 172 cm · 55 kg → 60 kg · iron controlled with pills
const NUT = { p: 110, kRest: 2300, kTrain: 2700, kDouble: 3000 };
const GOAL_KG = 60;

const DEF = { bw: 55, logs: {}, done: { "2026-10-12": "TU" }, body: [], acts: {}, dayPick: {}, actMap: {}, fenceMark: {},
  lifts: { bench: 35, ohp: 30, pullreps: 5 }, row500: 136,
  tests: [{ d: "2026-10-12", bench: 35, ohp: 30, preps: 5, bw: 55, note: "Row: 1780 m in 8:05 (damper 6)" }],
  conn: "", polar: false, sheetSync: "", lastSync: 0, setAt: 0, dirty: false, pushed: "" };
let S = load();
let tab = "hoy";
let viewDate = todayS();
let openedOn = todayS();
function load() {
  try {
    const p = JSON.parse(localStorage.getItem(LS) || "null");
    if (!p) return JSON.parse(JSON.stringify(DEF));
    const o = Object.assign({}, JSON.parse(JSON.stringify(DEF)), p);
    ["logs", "done", "acts", "dayPick", "lifts", "actMap", "fenceMark"].forEach(function (k) { o[k] = o[k] || {}; });
    o.body = o.body || []; o.tests = o.tests || []; return o;
  } catch (e) { return JSON.parse(JSON.stringify(DEF)); }
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

// ═══════════════════════════════════════════
//  EXERCISES · c = how to · k = why it matters for sabre
//  kg: true = log the weight · per: "hand" for dumbbells · rm: which test sets the load
// ═══════════════════════════════════════════
const EX = {
  squat:   { n: "Back squat", g: "Legs", kg: true, rm: "squat", c: ["Bar on the upper back, feet shoulder-width.", "Sit down and back, knees track over the toes.", "Drive up through the whole foot, chest tall."], k: "The base of your lunge power and of standing in guard for hours." },
  dl:      { n: "Deadlift", g: "Legs", kg: true, rm: "dl", c: ["Bar over mid-foot, hips back, flat back.", "Push the floor away, bar close to the legs.", "Lock out with the glutes, lower under control."], k: "Posterior chain: hips and hamstrings drive the explosive lunge." },
  bulg:    { n: "Bulgarian split squat", g: "Legs", kg: true, per: "hand", c: ["Rear foot on a bench, dumbbells at your sides.", "Drop straight down, weight on the front leg.", "Drive up through the front heel."], k: "Single-leg strength for the lunge and the recovery. Do the back leg side too: fencers get lopsided." },
  nordic:  { n: "Nordic hamstring curl", g: "Legs", c: ["Kneel, heels anchored (partner or bar).", "Lower your body forward as slowly as you can.", "Catch yourself with the hands and push back up."], k: "Protects the hamstrings from the fast lunge: the most common fencing strain." },
  copen:   { n: "Copenhagen plank", g: "Legs", c: ["Side plank on the forearm, top leg on a bench (knee for the easy version).", "Lift the hips and hold, bottom leg hanging."], k: "Adductors control the lunge recovery and protect the groin." },
  calf:    { n: "Single-leg calf raise", g: "Legs", kg: true, per: "hand", c: ["On a step, one foot, dumbbell in the same-side hand.", "Full range: deep stretch, high on the toes, 1 s pause."], k: "Ankles and calves: every step in guard and every fleche starts here." },
  bench:   { n: "Bench press", g: "Upper", kg: true, rm: "bench", c: ["Shoulder blades back and down, feet planted.", "Lower to the lower chest, elbows ~45°.", "Press up without bouncing."] },
  ohp:     { n: "Overhead press", g: "Upper", kg: true, rm: "ohp", c: ["Standing, bar on the front of the shoulders.", "Glutes and abs tight, press straight up.", "Head through at the top, lower under control."], k: "Shoulder strength and stability for the sabre arm." },

function chartCard(title, big, sub, svg) {

// weekly average of daily values [[ds, v]] → [[weekStartDs, avg]]

// ═══════════════════════════════════════════
//  PROGRESS · the same as the sheet's Panel, on the phone
// ═══════════════════════════════════════════
//  COACH · a card every day and a review every Monday, from your own data (no internet, no AI)
// ═══════════════════════════════════════════
function nightOf(ds) {
  const sl = (S.sleeph || []).filter(function (r) { return r[0] <= ds && r[0] >= addD(ds, -1); }).sort(function (a, b) { return a[0] < b[0] ? -1 : 1; }).pop();

}
function avgOf(a) { a = a.filter(function (v) { return v != null; }); return a.length ? a.reduce(function (s, v) { return s + v; }, 0) / a.length : null; }
function sleepAvg(from, to, i) { return avgOf((S.sleeph || []).filter(function (r) { return r[0] >= from && r[0] <= to; }).map(function (r) { return chNum(r[i]); })); }

  else if (n) out.push(train ? "Normal recovery" + (n.nr != null ? " (" + n.nr + "/6)" : "") + ": follow the plan." : "Rest day: walk, stretch and hit your 110 g of protein.");
  else out.push(train ? "No sleep data from last night: follow the plan and listen to your body." : "Rest day: walk, stretch and eat well.");

  }

function coachWeek(ds) {

function coachHTML(ds) {

// ═══════════════════════════════════════════
function sgn(v, u) { v = Math.round(v * 10) / 10; return (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v) + (u || ""); }
function renderProg() {
  let h = weekReviewHTML();
  const T = S.tests || [];

  if (!kg.length || kg[0][0] > START) kg.unshift([START, 55]);

  h += chartCard("Body weight", kl[1] + " kg", sgn(kl[1] - 55, " kg") + " since the start · " + (kl[1] < GOAL_KG ? Math.round((GOAL_KG - kl[1]) * 10) / 10 + " kg to go" : "goal reached!"),

  h += chartCard("Sleep", ln ? Math.round(ln[1]) : "—", (ln ? "Last night (" + fdate(ln[0]) + ")" : "") + (ss.length ? " · this week's average " + Math.round(ss[ss.length - 1][1]) : "") + " · Polar score 0-100", lineChart([{ name: "Sleep", color: CH.blue, pts: ss }], { fmt: function (v) { return Math.round(v); }, xfmt: function (d) { return "wk " + fdate(d); }, empty: "Appears once Polar is connected" }));
  h += chartCard("Nightly Recharge", lr ? lr[3] + "/6" : "—", (lr ? "Last night (" + fdate(lr[0]) + ")" : "") + (nr.length ? " · this week's average " + Math.round(nr[nr.length - 1][1] * 10) / 10 : "") + " · 1 = very poor · 6 = very good", lineChart([{ name: "Recharge", color: CH.pink, pts: nr }], { xfmt: function (d) { return "wk " + fdate(d); }, empty: "Appears once Polar is connected" }));
